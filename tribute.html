<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribute to Virat Kohli</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: #fff;
            background-color: #000;
            background-image: url('stadium.jpg'); /* Replace with your background image URL */
            background-size: cover;
            background-position: center;
        }
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .content {
            display: flex;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
        }
        .info {
            flex: 1;
            padding: 20px;
        }
        .info h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .info p {
            font-size: 1.2em;
            line-height: 1.6;
        }
        .profile {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .profile img {
            width: 400px;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #ccc;
            text-align: center;
        }
        .center-image {
        display: block;
        margin: 0 auto; /* Center the image */
        width: 300px; /* Adjust the width as needed */
      }
    
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="info">
                <h1>Tribute to Virat Kohli</h1>
            <div class="profile">
                <img src="virat.jpg" alt="Virat Kohli" class="center-image"> <!-- Replace with an image of Virat Kohli -->
                <P>VIRAT KOHLI<br>
                    Born :  5 November 1988<br>
                    Spouse : Anushka Sharma <br>
                    Profession : Cricketer <br>
                    Awards :<br>
                            Padma Shri<br>
                            Arjuna Award<br>
                            Major Dhyanchand Khel Ratna Award<br>
            </div>
        </div>
    </div>
    <div class="footer">
        &copy; 2024 Tribute Page. All rights reserved.
    </div>
</body>
</html>
